<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yahtzee</title>
  <meta name="description" content="A clean, accessible single-page Yahtzee game." />
  <style>
:root {
  /* Colorblind-safe palette: blues, amber, slate — no red/green dependence */
  --bg: #0f172a;
  --bg-panel: #1e293b;
  --bg-panel-2: #273449;
  --ink: #e2e8f0;
  --ink-dim: #94a3b8;
  --accent: #38bdf8;     /* sky blue */
  --accent-strong: #0ea5e9;
  --gold: #f5b301;       /* amber — distinguishable for all CVD types */
  --hold: #f5b301;
  --line: #334155;
  --good: #38bdf8;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --radius: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(1200px 600px at 80% -10%, #1e3a5f 0%, transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
}

.app {
  max-width: 920px;
  margin: 0 auto;
  padding: 24px 18px 60px;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.logo {
  font-size: clamp(28px, 6vw, 44px);
  letter-spacing: 6px;
  margin: 0;
  font-weight: 800;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.grand-total {
  margin: 0;
  font-size: 14px;
  color: var(--ink-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.grand-total span {
  display: inline-block;
  min-width: 2ch;
  font-size: 22px;
  font-weight: 800;
  color: var(--gold);
  margin-left: 4px;
}

/* ---------- Buttons ---------- */
.btn {
  font: inherit;
  border: none;
  border-radius: 10px;
  padding: 12px 22px;
  cursor: pointer;
  font-weight: 700;
  transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn-primary {
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color: #042c3d;
  box-shadow: 0 6px 18px rgba(56, 189, 248, .35);
}
.btn-primary:hover { box-shadow: 0 8px 24px rgba(56, 189, 248, .5); }
.btn-primary:disabled {
  background: #334155;
  color: #64748b;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--bg-panel-2); }

/* ---------- Dice ---------- */
.play {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 26px;
}

.dice-tray {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.die {
  width: 74px;
  height: 74px;
  border-radius: 16px;
  background: #f8fafc;
  position: relative;
  cursor: pointer;
  border: 3px solid transparent;
  box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.08);
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 12px;
  gap: 2px;
}
.die:hover { transform: translateY(-3px); }
.die:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.die .pip {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #0f172a;
  align-self: center;
  justify-self: center;
}

/* pip positions via grid areas */
.die .pip.tl { grid-area: 1 / 1; }
.die .pip.tc { grid-area: 1 / 2; }
.die .pip.tr { grid-area: 1 / 3; }
.die .pip.ml { grid-area: 2 / 1; }
.die .pip.mc { grid-area: 2 / 2; }
.die .pip.mr { grid-area: 2 / 3; }
.die .pip.bl { grid-area: 3 / 1; }
.die .pip.bc { grid-area: 3 / 2; }
.die .pip.br { grid-area: 3 / 3; }

.die.held {
  border-color: var(--hold);
  background: #fff7e0;
  box-shadow: 0 0 0 3px rgba(245,179,1,.25), 0 6px 14px rgba(0,0,0,.35);
}
.die.held::after {
  content: "HELD";
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #3a2c00;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 2px 6px;
  border-radius: 6px;
}
.die.disabled {
  cursor: default;
  opacity: .9;
}
.die.disabled:hover { transform: none; }

@keyframes roll {
  0%   { transform: rotate(0deg) scale(1); }
  30%  { transform: rotate(180deg) scale(.85); }
  60%  { transform: rotate(320deg) scale(1.08); }
  100% { transform: rotate(360deg) scale(1); }
}
.die.rolling { animation: roll .45s ease; }

/* ---------- Roll controls ---------- */
.roll-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
#roll-btn { min-width: 200px; font-size: 17px; }
.rolls-left { margin: 0; color: var(--ink-dim); }
.rolls-left strong { color: var(--ink); font-size: 18px; }
.hint { margin: 0; color: var(--ink-dim); font-size: 13px; text-align: center; min-height: 1em; }

/* ---------- Scorecard ---------- */
.scorecard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
@media (max-width: 720px) {
  .scorecard { grid-template-columns: 1fr; }
}

.score-section {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 10px;
  box-shadow: var(--shadow);
}

.section-title {
  margin: 0 0 12px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
}

.score-list { list-style: none; margin: 0; padding: 0; }

.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 4px;
  border: 1px solid transparent;
  transition: background .12s ease, border-color .12s ease;
}
.score-row .label { font-size: 15px; }
.score-row .label small { display: block; color: var(--ink-dim); font-size: 11px; }

.score-row .value {
  min-width: 56px;
  text-align: right;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* available (not yet scored) row: clickable, shows potential */
.score-row.available {
  background: var(--bg-panel-2);
  border-color: var(--line);
  cursor: pointer;
}
.score-row.available:hover {
  border-color: var(--accent);
  background: #2c3e57;
}
.score-row.available:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.score-row.available .value {
  color: var(--gold);
}
.score-row.available .value.zero { color: var(--ink-dim); }

/* locked (already scored) row */
.score-row.locked .value { color: var(--good); }
.score-row.locked .label { color: var(--ink-dim); }

.subtotal-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px;
  margin-top: 6px;
  border-top: 1px dashed var(--line);
  font-weight: 700;
  color: var(--ink-dim);
}
.subtotal-row small { color: var(--ink-dim); font-weight: 400; }
.subtotal-row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Game over ---------- */
.gameover[hidden] { display: none; }
.gameover {
  position: fixed;
  inset: 0;
  background: rgba(8, 15, 30, .78);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 50;
}
.gameover-card {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 34px 40px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 420px;
  width: 100%;
}
.gameover-card h2 {
  margin: 0 0 14px;
  font-size: 30px;
  letter-spacing: 2px;
  color: var(--gold);
}
.final-score { font-size: 18px; margin: 0 0 6px; }
.final-score strong { color: var(--accent); font-size: 26px; }
.final-msg { color: var(--ink-dim); margin: 0 0 22px; }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="logo">YAHTZEE</h1>
      <div class="topbar-right">
        <p class="grand-total" aria-live="polite">
          Total <span id="grand-total">0</span>
        </p>
        <button id="new-game" class="btn btn-ghost" type="button">New Game</button>
      </div>
    </header>

    <section class="play" aria-label="Dice area">
      <div class="dice-tray" id="dice-tray" role="group" aria-label="Five dice. Click a die to hold it between rolls.">
        <!-- dice injected by JS -->
      </div>

      <div class="roll-controls">
        <button id="roll-btn" class="btn btn-primary" type="button">
          Roll Dice
        </button>
        <p class="rolls-left" aria-live="polite">
          Rolls left: <strong id="rolls-left">3</strong>
        </p>
        <p class="hint" id="hint">Roll to start your turn. Click dice to hold them.</p>
      </div>
    </section>

    <section class="scorecard" aria-label="Scorecard">
      <div class="score-section">
        <h2 class="section-title">Upper Section</h2>
        <ul class="score-list" id="upper-list"></ul>
        <div class="subtotal-row">
          <span>Bonus <small>(63+ scores 35)</small></span>
          <span id="upper-bonus">0</span>
        </div>
        <div class="subtotal-row">
          <span>Upper Total</span>
          <span id="upper-total">0</span>
        </div>
      </div>

      <div class="score-section">
        <h2 class="section-title">Lower Section</h2>
        <ul class="score-list" id="lower-list"></ul>
        <div class="subtotal-row">
          <span>Yahtzee Bonus <small>(+100 each)</small></span>
          <span id="yahtzee-bonus">0</span>
        </div>
        <div class="subtotal-row">
          <span>Lower Total</span>
          <span id="lower-total">0</span>
        </div>
      </div>
    </section>

    <div class="gameover" id="gameover" hidden>
      <div class="gameover-card" role="dialog" aria-modal="true" aria-labelledby="go-title">
        <h2 id="go-title">Game Over</h2>
        <p class="final-score">Final score: <strong id="final-score">0</strong></p>
        <p id="final-msg" class="final-msg"></p>
        <button id="play-again" class="btn btn-primary" type="button">Play Again</button>
      </div>
    </div>
  </main>

  <script>
"use strict";

/* ============================================================
   Yahtzee — single-player, 13 turns
   Categories, scoring rules, dice holding, and live preview.
   ============================================================ */

// Pip layout per die face (which grid cells get a pip).
const PIP_LAYOUT = {
  1: ["mc"],
  2: ["tl", "br"],
  3: ["tl", "mc", "br"],
  4: ["tl", "tr", "bl", "br"],
  5: ["tl", "tr", "mc", "bl", "br"],
  6: ["tl", "tr", "ml", "mr", "bl", "br"],
};

const UPPER = [
  { key: "ones", label: "Ones", face: 1 },
  { key: "twos", label: "Twos", face: 2 },
  { key: "threes", label: "Threes", face: 3 },
  { key: "fours", label: "Fours", face: 4 },
  { key: "fives", label: "Fives", face: 5 },
  { key: "sixes", label: "Sixes", face: 6 },
];

const LOWER = [
  { key: "threeKind", label: "Three of a Kind", sub: "Sum of all dice" },
  { key: "fourKind", label: "Four of a Kind", sub: "Sum of all dice" },
  { key: "fullHouse", label: "Full House", sub: "Scores 25" },
  { key: "smallStraight", label: "Small Straight", sub: "Scores 30" },
  { key: "largeStraight", label: "Large Straight", sub: "Scores 40" },
  { key: "yahtzee", label: "Yahtzee", sub: "Scores 50" },
  { key: "chance", label: "Chance", sub: "Sum of all dice" },
];

const ALL_CATS = [...UPPER, ...LOWER];

// ---------- Scoring functions ----------
function counts(dice) {
  const c = [0, 0, 0, 0, 0, 0, 0]; // index = face value
  dice.forEach((d) => c[d]++);
  return c;
}
const sum = (dice) => dice.reduce((a, b) => a + b, 0);

function scoreUpper(face, dice) {
  return counts(dice)[face] * face;
}

function hasNOfKind(dice, n) {
  return counts(dice).some((cnt) => cnt >= n);
}

function isFullHouse(dice) {
  const c = counts(dice).filter((x) => x > 0).sort();
  // Either exactly 2+3, or five-of-a-kind (counts as full house in most rule sets)
  if (c.length === 2 && c[0] === 2 && c[1] === 3) return true;
  return false;
}

function hasStraight(dice, len) {
  const present = [...new Set(dice)].sort((a, b) => a - b);
  let run = 1;
  let best = 1;
  for (let i = 1; i < present.length; i++) {
    run = present[i] === present[i - 1] + 1 ? run + 1 : 1;
    best = Math.max(best, run);
  }
  return best >= len;
}

// Returns the score a category would earn for the given dice.
function potentialScore(key, dice) {
  switch (key) {
    case "ones": return scoreUpper(1, dice);
    case "twos": return scoreUpper(2, dice);
    case "threes": return scoreUpper(3, dice);
    case "fours": return scoreUpper(4, dice);
    case "fives": return scoreUpper(5, dice);
    case "sixes": return scoreUpper(6, dice);
    case "threeKind": return hasNOfKind(dice, 3) ? sum(dice) : 0;
    case "fourKind": return hasNOfKind(dice, 4) ? sum(dice) : 0;
    case "fullHouse": return isFullHouse(dice) ? 25 : 0;
    case "smallStraight": return hasStraight(dice, 4) ? 30 : 0;
    case "largeStraight": return hasStraight(dice, 5) ? 40 : 0;
    case "yahtzee": return hasNOfKind(dice, 5) ? 50 : 0;
    case "chance": return sum(dice);
    default: return 0;
  }
}

// ---------- Game state ----------
const state = {
  dice: [1, 2, 3, 4, 5],
  held: [false, false, false, false, false],
  rollsLeft: 3,
  scores: {},          // key -> number (locked)
  yahtzeeBonus: 0,
  turnsLeft: 13,
  hasRolledThisTurn: false,
};

// ---------- DOM ----------
const $ = (id) => document.getElementById(id);
const tray = $("dice-tray");
const rollBtn = $("roll-btn");
const hintEl = $("hint");

function newGame() {
  state.dice = [1, 2, 3, 4, 5];
  state.held = [false, false, false, false, false];
  state.rollsLeft = 3;
  state.scores = {};
  state.yahtzeeBonus = 0;
  state.turnsLeft = 13;
  state.hasRolledThisTurn = false;
  $("gameover").hidden = true;
  buildDice();
  buildScorecard();
  render();
  hintEl.textContent = "Roll to start your turn. Click dice to hold them.";
}

function buildDice() {
  tray.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const die = document.createElement("button");
    die.className = "die disabled";
    die.type = "button";
    die.dataset.index = i;
    die.setAttribute("aria-label", `Die ${i + 1}`);
    die.addEventListener("click", () => toggleHold(i));
    tray.appendChild(die);
  }
}

function renderDie(i) {
  const die = tray.children[i];
  const value = state.dice[i];
  die.innerHTML = "";
  PIP_LAYOUT[value].forEach((pos) => {
    const pip = document.createElement("span");
    pip.className = `pip ${pos}`;
    die.appendChild(pip);
  });
  die.classList.toggle("held", state.held[i]);
  // Dice are only interactive after the first roll and before the turn ends.
  const interactive = state.hasRolledThisTurn && state.rollsLeft > 0;
  die.classList.toggle("disabled", !interactive);
  die.setAttribute(
    "aria-label",
    `Die ${i + 1}, showing ${value}.${state.held[i] ? " Held." : ""}` +
      (interactive ? " Click to " + (state.held[i] ? "release." : "hold.") : "")
  );
}

function toggleHold(i) {
  if (!state.hasRolledThisTurn || state.rollsLeft === 0) return;
  state.held[i] = !state.held[i];
  renderDie(i);
}

function rollDice() {
  if (state.rollsLeft === 0) return;
  state.hasRolledThisTurn = true;
  for (let i = 0; i < 5; i++) {
    if (!state.held[i]) {
      state.dice[i] = 1 + Math.floor(Math.random() * 6);
      const die = tray.children[i];
      die.classList.remove("rolling");
      void die.offsetWidth; // restart animation
      die.classList.add("rolling");
    }
  }
  state.rollsLeft--;
  render();
  hintEl.textContent =
    state.rollsLeft > 0
      ? "Hold dice you want to keep, then roll again — or pick a category to score."
      : "No rolls left. Choose a category to score this turn.";
}

function buildScorecard() {
  renderList("upper-list", UPPER);
  renderList("lower-list", LOWER);
}

function renderList(listId, cats) {
  const ul = $(listId);
  ul.innerHTML = "";
  cats.forEach((cat) => {
    const li = document.createElement("li");
    li.className = "score-row";
    li.dataset.key = cat.key;
    li.tabIndex = 0;
    li.innerHTML =
      `<span class="label">${cat.label}` +
      (cat.sub ? `<small>${cat.sub}</small>` : "") +
      `</span><span class="value"></span>`;
    li.addEventListener("click", () => chooseCategory(cat.key));
    li.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        chooseCategory(cat.key);
      }
    });
    ul.appendChild(li);
  });
}

function chooseCategory(key) {
  // Can only score after rolling at least once this turn, and only once per category.
  if (!state.hasRolledThisTurn) return;
  if (key in state.scores) return;

  let gained = potentialScore(key, state.dice);

  // Yahtzee bonus: a second+ scoring Yahtzee earns +100 (if the Yahtzee box was already a 50).
  if (
    hasNOfKind(state.dice, 5) &&
    state.scores.yahtzee === 50 &&
    key !== "yahtzee"
  ) {
    state.yahtzeeBonus += 100;
  }

  state.scores[key] = gained;
  state.turnsLeft--;

  // Reset for next turn.
  state.held = [false, false, false, false, false];
  state.rollsLeft = 3;
  state.hasRolledThisTurn = false;

  render();

  if (state.turnsLeft === 0) {
    endGame();
  } else {
    hintEl.textContent = "Scored! Roll to start your next turn.";
  }
}

// ---------- Totals ----------
function upperSubtotal() {
  return UPPER.reduce((t, c) => t + (state.scores[c.key] || 0), 0);
}
function upperBonus() {
  return upperSubtotal() >= 63 ? 35 : 0;
}
function lowerSubtotal() {
  return LOWER.reduce((t, c) => t + (state.scores[c.key] || 0), 0);
}
function grandTotal() {
  return (
    upperSubtotal() + upperBonus() + lowerSubtotal() + state.yahtzeeBonus
  );
}

function render() {
  for (let i = 0; i < 5; i++) renderDie(i);

  rollBtn.disabled = state.rollsLeft === 0;
  rollBtn.textContent =
    state.rollsLeft === 3 ? "Roll Dice" : `Roll Again (${state.rollsLeft})`;
  $("rolls-left").textContent = state.rollsLeft;

  ALL_CATS.forEach((cat) => {
    const li = document.querySelector(`[data-key="${cat.key}"]`);
    const valEl = li.querySelector(".value");
    li.classList.remove("available", "locked");
    valEl.classList.remove("zero");

    if (cat.key in state.scores) {
      li.classList.add("locked");
      li.tabIndex = -1;
      valEl.textContent = state.scores[cat.key];
    } else if (state.hasRolledThisTurn) {
      li.classList.add("available");
      li.tabIndex = 0;
      const p = potentialScore(cat.key, state.dice);
      valEl.textContent = p;
      if (p === 0) valEl.classList.add("zero");
    } else {
      li.tabIndex = -1;
      valEl.textContent = "";
    }
  });

  $("upper-bonus").textContent = upperBonus();
  $("upper-total").textContent = upperSubtotal() + upperBonus();
  $("yahtzee-bonus").textContent = state.yahtzeeBonus;
  $("lower-total").textContent = lowerSubtotal() + state.yahtzeeBonus;
  $("grand-total").textContent = grandTotal();
}

function endGame() {
  const total = grandTotal();
  $("final-score").textContent = total;
  let msg;
  if (total >= 300) msg = "Incredible — that's a championship score!";
  else if (total >= 250) msg = "Excellent rolling!";
  else if (total >= 200) msg = "Solid game. Well played.";
  else if (total >= 150) msg = "Not bad — the dice were fair to you.";
  else msg = "The dice were stingy this time. Run it back!";
  $("final-msg").textContent = msg;
  $("gameover").hidden = false;
}

// ---------- Wire up ----------
rollBtn.addEventListener("click", rollDice);
$("new-game").addEventListener("click", newGame);
$("play-again").addEventListener("click", newGame);

newGame();

  </script>
</body>
</html>
